<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>{{.Title}} — goftp</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #181b23;
    --border: #262a36;
    --text: #e0e1e6;
    --text-dim: #8b8d98;
    --accent: #6e9eff;
    --accent-hover: #88b4ff;
    --folder: #f0c36d;
    --file: #8b8d98;
    --hover-bg: #1e2230;
    --radius: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }
  header {
    margin-bottom: 1.5rem;
  }
  header h1 {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  header h1 .logo { color: var(--accent); font-weight: 700; }
  .breadcrumb {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 0.35rem;
    word-break: break-all;
  }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 0.65rem 1rem;
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
  }
  td { padding: 0.55rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--hover-bg); }
  .name-cell { display: flex; align-items: center; gap: 0.6rem; }
  .name-cell a { color: var(--text); text-decoration: none; font-weight: 450; word-break: break-all; }
  .name-cell a:hover { color: var(--accent-hover); }
  .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .icon-folder { color: var(--folder); }
  .icon-file { color: var(--file); }
  .size { color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .date { color: var(--text-dim); white-space: nowrap; font-size: 0.85rem; text-align: right; }
  .upload { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.85rem; }
  .upload input, .upload button {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.4rem 0.6rem;
  }
  .upload input[type=file] { flex: 1; min-width: 12rem; }
  .upload label { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--text-dim); }
  .upload label input { padding: 0; }
  .upload button { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; cursor: pointer; }
  .upload button:hover { background: var(--accent-hover); }
  .parent-link { display: inline-flex; align-items: center; gap: 0.3rem; margin-bottom: 0.75rem; }
  .parent-link a { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
  .parent-link a:hover { text-decoration: underline; }
  .empty {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  footer {
    margin-top: 2rem;
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  @media (max-width: 600px) {
    .container { padding: 1rem; }
    .date-col { display: none; }
    td, th { padding: 0.5rem 0.75rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="logo">goftp</span></h1>
    <div class="breadcrumb">{{.Path}}</div>
  </header>

  {{with .Upload}}
  <form class="upload" method="post" enctype="multipart/form-data" action="{{.Action}}">
    <input type="password" name="{{.KeyField}}" placeholder="Upload key" autocomplete="current-password" required>
    <label><input type="checkbox" name="replace" value="1"> Replace existing</label>
    <input type="file" name="file" multiple required>
    <button type="submit">Upload</button>
  </form>
  {{end}}

  {{with .Parent}}
  <div class="parent-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    <a href="{{.}}">Parent directory</a>
  </div>
  {{end}}

  <div class="table-wrap">
  {{if .Items}}
    <table>
      <thead><tr>
        <th>Name</th>
        <th style="width:100px; text-align:right">Size</th>
        <th class="date-col" style="width:160px; text-align:right">Modified</th>
      </tr></thead>
      <tbody>
      {{range .Items}}
        <tr>
          <td>
            <div class="name-cell">
              {{if .IsDir}}
              <svg class="icon icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
              {{else}}
              <svg class="icon icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              {{end}}
              <a href="{{.Href}}">{{.Name}}</a>
            </div>
          </td>
          <td class="size">{{.Size}}</td>
          <td class="date date-col">{{.ModTime}}</td>
        </tr>
      {{end}}
      </tbody>
    </table>
  {{else}}
    <div class="empty">This directory is empty.</div>
  {{end}}
  </div>

  <footer>goftp &middot; resumable file server</footer>
</div>
</body>
</html>
