{{define "login"}}{{template "head" .}}
<body class="auth">
<main class="auth-wrap">
  <a class="brand" href="/"><svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg>goftp</a>
  <div class="card auth-card">
    <h1>Sign in</h1>
    <p>Welcome back. Sign in to browse and share files.</p>
    <form method="post" action="/.auth/login" class="stack">
      {{with .Error}}<div class="alert error" role="alert"><svg class="i" aria-hidden="true"><use href="#i-alert"/></svg><span>{{.}}</span></div>{{end}}
      <input type="hidden" name="next" value="{{.Next}}">
      <label class="field"><span>Username</span>
        <input name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required{{if not .Username}} autofocus{{end}}>
      </label>
      <label class="field"><span>Password</span>
        <span class="pw"><input type="password" name="password" autocomplete="current-password" required{{if .Username}} autofocus{{end}}></span>
        <span class="caps" hidden>Caps Lock is on</span>
      </label>
      <button type="submit" class="btn primary block">Sign in</button>
    </form>
  </div>
  <p class="auth-note">No account yet? Ask your administrator to create one.</p>
</main>
{{template "icons"}}
{{script}}
</body>
</html>
{{end}}
