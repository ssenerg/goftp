{{define "password"}}{{template "head" .}}
<body>
<div class="container">
  <div class="card">
    <h2>Change password</h2>
    {{if .Forced}}<p>Your password is temporary. Choose your own password to continue.</p>
    {{else}}<p>Signed in as {{.User}}. Other sessions will be signed out.</p>{{end}}
    <form method="post" action="/.auth/password">
      {{with .Error}}<div class="error" role="alert">{{.}}</div>{{end}}
      <input type="hidden" name="next" value="{{.Next}}">
      <input type="hidden" name="username" value="{{.User}}" autocomplete="username">
      <label>Current password
        <input type="password" name="current_password" autocomplete="current-password" required autofocus>
      </label>
      <label>New password (at least {{.MinLength}} characters)
        <input type="password" name="new_password" autocomplete="new-password" minlength="{{.MinLength}}" required>
      </label>
      <label>Repeat new password
        <input type="password" name="confirm_password" autocomplete="new-password" minlength="{{.MinLength}}" required>
      </label>
      <button type="submit" class="primary">Change password</button>
    </form>
    <form method="post" action="/.auth/logout" style="margin-top: 0.75rem; align-items: center">
      <button type="submit" class="linkbutton">Sign out</button>
    </form>
  </div>
</div>
</body>
</html>
{{end}}
