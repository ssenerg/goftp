{{define "head"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>{{.Title}} — goftp</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #181b23;
    --border: #262a36;
    --text: #e0e1e6;
    --text-dim: #8b8d98;
    --accent: #6e9eff;
    --accent-hover: #88b4ff;
    --folder: #f0c36d;
    --file: #8b8d98;
    --hover-bg: #1e2230;
    --error: #ff7b7b;
    --radius: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }
  header {
    margin-bottom: 1.5rem;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
  }
  header h1 {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  header h1 .logo { color: var(--accent); font-weight: 700; }
  .breadcrumb {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 0.35rem;
    word-break: break-all;
  }
  .userbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; font-size: 0.85rem; color: var(--text-dim); }
  .userbar strong { color: var(--text); font-weight: 500; }
  .userbar a, .linkbutton { color: var(--accent); text-decoration: none; }
  .userbar a:hover, .linkbutton:hover { text-decoration: underline; }
  .linkbutton { font: inherit; background: none; border: none; cursor: pointer; }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 0.65rem 1rem;
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
  }
  td { padding: 0.55rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--hover-bg); }
  .name-cell { display: flex; align-items: center; gap: 0.6rem; }
  .name-cell a { color: var(--text); text-decoration: none; font-weight: 450; word-break: break-all; }
  .name-cell a:hover { color: var(--accent-hover); }
  .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .icon-folder { color: var(--folder); }
  .icon-file { color: var(--file); }
  .size { color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .date { color: var(--text-dim); white-space: nowrap; font-size: 0.85rem; text-align: right; }
  input, button {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.4rem 0.6rem;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; cursor: pointer; }
  button.primary:hover { background: var(--accent-hover); }
  .upload { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.85rem; }
  .upload input[type=file] { flex: 1; min-width: 12rem; }
  .upload label { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--text-dim); }
  .upload label input { padding: 0; }
  .card {
    max-width: 380px;
    margin: 4rem auto 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
  }
  .card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.35rem; }
  .card p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 1rem; }
  .card form { display: flex; flex-direction: column; gap: 0.85rem; }
  .card label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.85rem; color: var(--text-dim); }
  .card input { background: var(--bg); padding: 0.55rem 0.7rem; }
  .card button.primary { padding: 0.55rem; margin-top: 0.25rem; }
  .card .error { color: var(--error); font-size: 0.85rem; margin-bottom: 0.25rem; }
  .parent-link { display: inline-flex; align-items: center; gap: 0.3rem; margin-bottom: 0.75rem; }
  .parent-link a { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
  .parent-link a:hover { text-decoration: underline; }
  .empty {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  footer {
    margin-top: 2rem;
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  @media (max-width: 600px) {
    .container { padding: 1rem; }
    .date-col { display: none; }
    td, th { padding: 0.5rem 0.75rem; }
    .card { margin-top: 1.5rem; }
  }
</style>
</head>
{{end}}

{{define "userbar"}}
<nav class="userbar">
  {{if .User}}
  <span>Signed in as <strong>{{.User}}</strong>{{with .Role}} ({{.}}){{end}}</span>
  <a href="/.auth/password">Change password</a>
  <form method="post" action="/.auth/logout"><button type="submit" class="linkbutton">Sign out</button></form>
  {{else}}
  <a href="/.auth/login?next={{.Here}}">Sign in</a>
  {{end}}
</nav>
{{end}}
